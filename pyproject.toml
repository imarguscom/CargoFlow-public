[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cargoflow"
version = "0.1.0"
description = "Deadline-aware logistics optimisation with constraint-guided preference cost"
requires-python = ">=3.11"
dependencies = ["pyvrp==0.12.2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
ml = ["lightgbm>=4.0,<5", "pandas>=2.0,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
